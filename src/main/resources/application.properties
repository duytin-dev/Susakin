#App name
spring.application.name=${SPRING_APP_NAME:Susakin}
#Server (Render dùng biến PORT)
server.port=${PORT:8080}
#Database config
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sasukin}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=${SPRING_DATABASE_DRIVER:org.postgresql.Driver}
#JPA config
#spring.jpa.show-sql=${SPRING_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${SPRING_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.format_sql=${SPRING_FORMAT_SQL:true}
#Connection pool (Render free tier)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
#Console config
logging.pattern.console=${SPRING_LOGGING_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}
#JWT config
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
#Seed data (tự động tạo dữ liệu mẫu khi DB trống)
app.seed.enabled=${APP_SEED_ENABLED:true}
#CORS
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://*.onrender.com}
